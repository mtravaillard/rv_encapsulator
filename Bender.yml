# Package metadata. Required.
package:
  # The name of the package. Required.
  name: rv_encapsulator

  # The list of package authors and contributors. Optional.
  # By convention, authors should be listed in the form shown below.
  authors: ["Umberto Laghi <umberto.laghi2@unibo.it>"]

dependencies:
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.38.0 }
  axi:                { git: "https://github.com/pulp-platform/axi.git",                version: 0.39.8 }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", version: 0.4.5  }

# List of source files in this package. Optional.
sources:
  # Source files can be grouped:
  - files:
      - src/include/encap_pkg.sv
      - src/rtl/encapsulator.sv
      - src/rtl/atb_transmitter.sv
      - src/rtl/slicer.sv
      - src/rtl/rv_encapsulator_atb.sv
      - src/rtl/atb_slice_to_axi_lite.sv
      - src/rtl/rv_encapsulator_axi.sv